<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pon Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>

<body>
    <header class="p-header l-header">
        <div class="p-header__inner l-inner">
            <div class="p-header__content">
                <div class="p-header-logo">
                    <a class="p-header-logo__link" href="index.html">
                        <img class="p-header-logo__img c-img" src="img/icon/logo.svg" alt="pon design">
                    </a>
                </div>
                <div class="p-header__nav-wrap">
                    <nav id="global-nav" class="p-header-nav" aria-label="グローバルナビゲーション">
                        <ul class="p-header-nav__list">
                            <li class="p-header-nav__item"><a href="news-list.html" class="p-header-nav__link">news</a>
                            </li>
                            <li class="p-header-nav__item"><a href="service-list.html"
                                    class="p-header-nav__link">service</a></li>
                            <li class="p-header-nav__item"><a href="works-list.html"
                                    class="p-header-nav__link">works</a></li>
                            <li class="p-header-nav__item"><a href="company.html" class="p-header-nav__link">company</a>
                            </li>
                            <li class="p-header-nav__item"><a href="recruit.html" class="p-header-nav__link">recruit</a>
                            </li>
                            <li class="p-header-nav__item"><a href="contact.html" class="p-header-nav__link">contact</a>
                            </li>
                        </ul>
                    </nav>
                </div>
                <button type="button" class="c-btn-menu js-btn-menu" aria-label="メニューを開く" aria-expanded="false"
                    aria-controls="global-nav">
                    <span class="c-btn-menu__line"></span>
                </button>
            </div>
        </div>
    </header>
    <main class="l-content">
        <section class="p-fv">
            <div class="p-fv__title">
                <h1 class="p-fv__main-title">contact</h1>
                <span class="p-fv__sub-title">お問い合わせ</span>
            </div>
        </section>
        <nav class="p-breadcrumbs" aria-label="パンくずリスト">
            <div class="l-inner">
                <div class="p-breadcrumbs__inner">
                    <ul class="p-breadcrumbs__list">
                        <li class="p-breadcrumbs__item"><a href="index.html" class="p-breadcrumbs__link">home</a></li>
                        <li class="p-breadcrumbs__item" aria-current="page">contact</li>
                    </ul>
                </div>
            </div>
        </nav>
        <section class="p-contact l-section">
            <div class="p-contact-inner l-inner--narrow">
                <h2 class="u-visually-hidden"></h2>
                <p class="p-contact__desc">Webサイトの制作のご依頼やお見積りなど、お気軽にご相談ください。</p>
                <form class="p-contact__form">
                    <div class="p-contact__field">
                        <p class="p-contact__label">
                            お問い合わせ種別
                            <span class="p-contact__required">必須</span>
                        </p>

                        <div class="p-contact__radio-group">
                            <label class="p-contact__radio">
                                <input type="radio" name="contact_type">
                                お仕事のご依頼・ご相談
                            </label>

                            <label class="p-contact__radio">
                                <input type="radio" name="contact_type">
                                お見積りのご依頼
                            </label>

                            <label class="p-contact__radio">
                                <input type="radio" name="contact_type">
                                採用について
                            </label>

                            <label class="p-contact__radio">
                                <input type="radio" name="contact_type">
                                その他
                            </label>
                        </div>
                    </div>

                    <div class="p-contact__field">
                        <label class="p-contact__label" for="name">
                            お名前
                            <span class="p-contact__required">必須</span>
                        </label>

                        <input id="name" class="p-contact__input" type="text" name="name">
                    </div>

                    <div class="p-contact__field">
                        <label class="p-contact__label" for="company">
                            会社名
                            <span class="p-contact__required">必須</span>
                        </label>

                        <input id="company" class="p-contact__input" type="text" name="company">
                    </div>

                    <div class="p-contact__field">
                        <label class="p-contact__label" for="email">
                            メールアドレス
                            <span class="p-contact__required">必須</span>
                        </label>

                        <input id="email" class="p-contact__input" type="email" name="email">
                    </div>

                    <div class="p-contact__field">
                        <label class="p-contact__label" for="tel">
                            電話番号
                            <span class="p-contact__note">
                                （半角数字ハイフンなし）
                            </span>
                        </label>

                        <input id="tel" class="p-contact__input" type="tel" name="tel">
                    </div>

                    <div class="p-contact__field">
                        <label class="p-contact__label" for="message">
                            お問い合わせ内容
                        </label>

                        <textarea id="message" class="p-contact__textarea" name="message" rows="8" placeholder="お問い合わせ内容を具体的にご記入くださいませ。"></textarea>
                    </div>

                    <div class="p-contact__field">
                        <label class="p-contact__label" for="route">
                            PON DESIGNをどちらでお知りになりましたか？
                            <span class="p-contact__required">必須</span>
                        </label>

                        <select id="route" class="p-contact__select" name="route">
                            <option value="">
                                選択してください
                            </option>

                            <option value="google">
                                Google/Yahoo検索
                            </option>

                            <option value="sns">
                                SNS
                            </option>

                            <option value="blog">
                                ブログ
                            </option>

                            <option value="friend">
                                友人や知人
                            </option>

                            <option value="other">
                                その他
                            </option>
                        </select>
                    </div>

                    <div class="p-contact__submit">
                        <button type="submit" class="c-btn">
                            送信する
                        </button>
                    </div>

                </form>
            </div>
        </section>
    </main>
    <footer class="p-footer l-footer">
        <div class="p-footer__inner l-inner">
            <nav class="p-footer-nav" aria-label="フッターナビゲーション">
                <ul class="p-footer-nav__list">
                    <li class="p-footer-nav__item"><a href="index.html" class="p-footer-nav__link">home</a></li>
                    <li class="p-footer-nav__item"><a href="news-list.html" class="p-footer-nav__link">news</a></li>
                    <li class="p-footer-nav__item"><a href="service-list.html" class="p-footer-nav__link">service</a>
                    </li>
                    <li class="p-footer-nav__item"><a href="works-list.html" class="p-footer-nav__link">works</a>
                    </li>
                    <li class="p-footer-nav__item"><a href="company.html" class="p-footer-nav__link">company</a>
                    </li>
                    <li class="p-footer-nav__item"><a href="recruit.html" class="p-footer-nav__link">recruit</a>
                    </li>
                    <li class="p-footer-nav__item"><a href="contact.html" class="p-footer-nav__link">contact</a>
                    </li>
                </ul>
            </nav>
            <small class="p-footer__copyright">&copy;pon design</small>
        </div>
    </footer>
    <button type="button" class="c-btn-top js-btn-top" aria-label="ページトップへ戻る">
    </button>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
